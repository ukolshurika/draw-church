[project]
name = "draw-church"
version = "0.1.0"
description = "Genealogical graph pipeline for 19th-century Russian parish registers"
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-playwright",
    "ruff",
    "mypy",
]
scrape = [
    "playwright",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
dummy-variable-rgx = "^_$"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["^viz\\.py$"]
